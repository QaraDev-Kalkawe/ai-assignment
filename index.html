        * {

            margin: 0;
            padding: 0;
        }

        body {
            background-color: #08090c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Sarabun', sans-serif;
            color: #d1d5db;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Header / Topic Selector */
        .header-nav {
            width: 1280px;
            max-width: 95vw;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111318;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #222732;
        }

        .topic-title {
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topic-select {
            background: #1a1d26;
            color: #fff;
            border: 1px solid #00ff88;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        /* Slide Viewport */
        .slider-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            max-width: 95vw;
            max-height: 80vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid #222732;
            background: #0d0f14;
        }

        .slides-container {
            display: flex;
            width: 500%; /* 5 slides x 100% */
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-container {
            width: 20%; /* 100% / 5 slides */
            height: 100%;
            background-color: #0d0f14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 70px;
            position: relative;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .slide-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 90% 10%, rgba(0, 255, 136, 0.04) 0%, transparent 60%);
            z-index: 0;
        }

        .slide-container::after {
            content: '';
            position: absolute;
            bottom: 25px;
            right: 30px;
            width: 120px;
            height: 2px;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            z-index: 0;
        }

        .slide-container > * {
            position: relative;
            z-index: 1;
        }

        h1, h2, h3 {
            color: #ffffff;
            font-family: 'Urbanist', 'Sarabun', sans-serif;
        }

        .slide-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .slide-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: left;
            width: 100%;
            color: #00ff88;
            border-left: 5px solid #00ff88;
            padding-left: 18px;
        }

        p, li {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        strong {
            color: #00ff88;
        }

        .title-layout {
            text-align: center;
            max-width: 900px;
        }

        .title-layout h1 {
            font-size: 56px;
            letter-spacing: -1px;
            margin-bottom: 15px;
            color: #fff;
        }

        .title-layout .subtitle {
            font-size: 24px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .content-area {
            align-items: center;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            width: 100%;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            width: 100%;
            align-items: center;
        }

        .result-box {
            background: #141721;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #222732;
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box code {
            font-family: monospace;
            color: #38bdf8;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #00ff88;
            color: #08090c;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #00cc6a;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .tiled-content {
            display: flex;
            gap: 20px;
            width: 100%;
            align-items: stretch;
        }

        .tile {
            background-color: #141721;
            border: 1px solid #222732;
            border-radius: 12px;
            padding: 30px 20px;
            flex: 1;
            text-align: center;
        }

        .tile .icon {
            font-size: 40px;
            color: #00ff88;
            margin-bottom: 15px;
        }

        .tile h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .quote-layout {
            text-align: center;
            max-width: 900px;
        }

        .quote-layout blockquote {
            font-size: 32px;
            color: #fff;
            line-height: 1.5;
            font-style: italic;
            margin-bottom: 25px;
            position: relative;
        }

        .quote-layout blockquote::before {
            content: '“';
            color: #00ff88;
            font-size: 90px;
            position: absolute;
            left: -40px;
            top: -30px;
            opacity: 0.25;
        }

        .prompt-box {
            background: rgba(0, 255, 136, 0.05);
            border: 1px dashed #00ff88;
            padding: 20px 25px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            color: #00ff88;
            font-size: 18px;
            text-align: left;
            line-height: 1.5;
        }

        /* Controls */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(17, 19, 24, 0.8);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #08090c;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .pagination {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #00ff88;
            width: 28px;
            border-radius: 10px;
            box-shadow: 0 0 8px #00ff88;
        }
    </style>
</head>
